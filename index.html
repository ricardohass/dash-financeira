<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Financeira</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='8' width='26' height='16' rx='3' fill='%2343c06a'/><rect x='5' y='10' width='22' height='12' rx='2' fill='none' stroke='%232a8a48' stroke-width='1.5'/><circle cx='16' cy='16' r='4.5' fill='%23eafff0'/><text x='16' y='19.5' text-anchor='middle' font-family='Arial, sans-serif' font-weight='700' font-size='8' fill='%232a8a48'>$</text><circle cx='8' cy='12' r='1' fill='%23eafff0'/><circle cx='24' cy='20' r='1' fill='%23eafff0'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;}
:root{--void:#05060c;--hull:#0d1322;--steel:#19233a;--line:rgba(120,150,210,.16);--ink:#e8eefb;--mut:#8a99bd;--gold:#ffd84d;}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 700px at 70% -10%,#101a33 0%,var(--void) 55%);
  color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;}
.hl-stars{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(1.4px 1.4px at 8% 12%,#fff,transparent),radial-gradient(1px 1px at 22% 30%,#cfe0ff,transparent),radial-gradient(1.6px 1.6px at 35% 9%,#fff,transparent),radial-gradient(1px 1px at 48% 22%,#fff,transparent),radial-gradient(1.3px 1.3px at 61% 14%,#dbe6ff,transparent),radial-gradient(1px 1px at 73% 33%,#fff,transparent),radial-gradient(1.6px 1.6px at 86% 11%,#fff,transparent),radial-gradient(1px 1px at 92% 47%,#cfe0ff,transparent),radial-gradient(1.2px 1.2px at 14% 58%,#fff,transparent),radial-gradient(1px 1px at 30% 72%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 64%,#dbe6ff,transparent),radial-gradient(1px 1px at 57% 80%,#fff,transparent),radial-gradient(1.3px 1.3px at 69% 60%,#fff,transparent),radial-gradient(1.6px 1.6px at 82% 78%,#fff,transparent),radial-gradient(1px 1px at 95% 66%,#cfe0ff,transparent),radial-gradient(1.2px 1.2px at 5% 88%,#fff,transparent),radial-gradient(1px 1px at 16% 18%,#fff,transparent),radial-gradient(1.3px 1.3px at 27% 6%,#dbe6ff,transparent),radial-gradient(1px 1px at 40% 36%,#fff,transparent),radial-gradient(1.5px 1.5px at 53% 12%,#fff,transparent),radial-gradient(1px 1px at 66% 42%,#cfe0ff,transparent),radial-gradient(1.4px 1.4px at 78% 20%,#fff,transparent),radial-gradient(1px 1px at 88% 38%,#fff,transparent),radial-gradient(1.2px 1.2px at 10% 44%,#dbe6ff,transparent),radial-gradient(1px 1px at 24% 86%,#fff,transparent),radial-gradient(1.3px 1.3px at 38% 78%,#fff,transparent),radial-gradient(1px 1px at 51% 94%,#cfe0ff,transparent),radial-gradient(1.5px 1.5px at 64% 74%,#fff,transparent),radial-gradient(1px 1px at 77% 90%,#fff,transparent),radial-gradient(1.3px 1.3px at 90% 82%,#dbe6ff,transparent),radial-gradient(1px 1px at 2% 64%,#fff,transparent),radial-gradient(1.2px 1.2px at 99% 54%,#fff,transparent);
  animation:tw1 7s ease-in-out infinite alternate;}
.hl-stars::before{content:"";position:absolute;inset:0;opacity:.55;
  background-image:radial-gradient(1px 1px at 12% 22%,#aab8d8,transparent),radial-gradient(1px 1px at 26% 50%,#bcc8e6,transparent),radial-gradient(1px 1px at 40% 16%,#aab8d8,transparent),radial-gradient(1px 1px at 54% 40%,#bcc8e6,transparent),radial-gradient(1px 1px at 67% 24%,#aab8d8,transparent),radial-gradient(1px 1px at 79% 52%,#bcc8e6,transparent),radial-gradient(1px 1px at 90% 30%,#aab8d8,transparent),radial-gradient(1px 1px at 3% 40%,#bcc8e6,transparent),radial-gradient(1px 1px at 18% 82%,#aab8d8,transparent),radial-gradient(1px 1px at 33% 92%,#bcc8e6,transparent),radial-gradient(1px 1px at 50% 72%,#aab8d8,transparent),radial-gradient(1px 1px at 63% 92%,#bcc8e6,transparent),radial-gradient(1px 1px at 76% 70%,#aab8d8,transparent),radial-gradient(1px 1px at 88% 90%,#bcc8e6,transparent),radial-gradient(1px 1px at 97% 84%,#aab8d8,transparent),radial-gradient(1px 1px at 9% 68%,#bcc8e6,transparent),radial-gradient(1px 1px at 6% 8%,#aab8d8,transparent),radial-gradient(1px 1px at 20% 38%,#bcc8e6,transparent),radial-gradient(1px 1px at 31% 64%,#aab8d8,transparent),radial-gradient(1px 1px at 45% 28%,#bcc8e6,transparent),radial-gradient(1px 1px at 58% 56%,#aab8d8,transparent),radial-gradient(1px 1px at 71% 36%,#bcc8e6,transparent),radial-gradient(1px 1px at 84% 62%,#aab8d8,transparent),radial-gradient(1px 1px at 94% 18%,#bcc8e6,transparent),radial-gradient(1px 1px at 14% 76%,#aab8d8,transparent),radial-gradient(1px 1px at 38% 50%,#bcc8e6,transparent),radial-gradient(1px 1px at 55% 84%,#aab8d8,transparent),radial-gradient(1px 1px at 70% 80%,#bcc8e6,transparent),radial-gradient(1px 1px at 83% 76%,#aab8d8,transparent),radial-gradient(1px 1px at 96% 70%,#bcc8e6,transparent);
  animation:tw2 11s ease-in-out infinite alternate;}
@keyframes tw1{from{opacity:.7}to{opacity:1}}
@keyframes tw2{from{opacity:.3}to{opacity:.65}}
.hl-wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 20px 60px;}

.hl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
.hl-eyebrow{font-family:Orbitron;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);opacity:.85;}
.hl-title{font-family:Orbitron;font-weight:900;font-size:34px;line-height:1;margin:6px 0 4px;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff,#9fc0ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hl-sub{color:var(--mut);font-size:13px;margin:0;}
.hl-ciclo{display:flex;flex-direction:column;gap:4px;}
.hl-ciclo label{font-family:Orbitron;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--mut);}
.hl-ciclo .row{display:flex;gap:6px;}
select,input{font-family:Inter;}
.hl-ciclo select{background:var(--hull);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;}

.hl-tabs{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap;}
.hl-tab{display:flex;align-items:center;gap:8px;background:var(--hull);border:1px solid var(--line);color:var(--mut);
  padding:9px 16px;border-radius:999px;font-family:Orbitron;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.18s;}
.hl-tab:hover{color:var(--ink);}
.hl-tab.on{color:#fff;border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px -6px var(--c);background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);}
.hl-tab-dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor;}

.hl-status{font-family:Orbitron;font-size:12px;letter-spacing:.08em;padding:10px 14px;border-radius:10px;margin-bottom:14px;border:1px solid var(--line);}
.hl-status.good{color:#9be8b4;background:rgba(67,224,106,.07);border-color:rgba(67,224,106,.25);}
.hl-status.bad{color:#ff9aa4;background:rgba(255,59,74,.07);border-color:rgba(255,59,74,.25);}

.hl-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.hl-hud{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--hull);border:1px solid var(--line);
  border-radius:14px;padding:16px 16px 14px;overflow:hidden;}
.hl-hud::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--a);box-shadow:0 0 14px var(--a);}
.hl-hud-corner{position:absolute;width:14px;height:14px;border:1px solid var(--a);opacity:.5;}
.hl-hud-corner.tl{top:8px;right:8px;border-left:0;border-bottom:0;}
.hl-hud-corner.br{bottom:8px;left:8px;border-right:0;border-top:0;}
.hl-hud-label{font-family:Orbitron;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);}
.hl-hud-value{display:block;font-family:Orbitron;font-weight:700;font-size:22px;margin:8px 0 2px;color:#fff;}
.hl-hud-sub{font-size:11px;color:var(--mut);}
.hl-hud-extra{display:block;margin-top:6px;font-size:11px;font-weight:600;}
.hl-hud-extra.good{color:#7fe6a0;}.hl-hud-extra.bad{color:#ff9aa4;}

.hl-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
.hl-col{display:flex;flex-direction:column;gap:16px;}
.hl-col.wide{min-width:0;}
.hl-row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

.hl-panel{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--hull);border:1px solid var(--line);border-radius:16px;padding:18px;}
.hl-panel.editing{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,216,77,.4),0 0 30px -12px var(--gold);}
.hl-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;}
.hl-panel-head h2{font-family:Orbitron;font-size:14px;letter-spacing:.06em;margin:0;color:#fff;}
.hl-panel-head p{font-size:11px;color:var(--mut);margin:3px 0 0;}
.hl-note{font-size:13px;color:var(--mut);line-height:1.6;margin:0;}

.hl-switch{display:flex;background:var(--void);border:1px solid var(--line);border-radius:999px;padding:3px;}
.hl-switch button{border:0;background:transparent;color:var(--mut);font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer;font-family:Inter;font-weight:600;}
.hl-switch button.on{background:var(--steel);color:#fff;}

.hl-form{display:flex;flex-direction:column;gap:11px;}
.hl-field{display:flex;flex-direction:column;gap:5px;}
.hl-field>span{font-size:11px;color:var(--mut);font-weight:600;}
.hl-field input{background:var(--void);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:15px;outline:none;transition:.15s;width:100%;}
.hl-field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,216,77,.12);}
.hl-field select{background:var(--void);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:15px;outline:none;width:100%;cursor:pointer;}
.hl-field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,216,77,.12);}
.hl-datefield{font-variant-numeric:tabular-nums;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

.hl-submit{margin-top:4px;border:0;border-radius:10px;padding:11px;font-family:Orbitron;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  background:linear-gradient(180deg,#ff5563,#d61f2d);color:#fff;box-shadow:0 8px 20px -10px #ff3b4a;transition:.15s;}
.hl-submit.income{background:linear-gradient(180deg,#56e784,#16a34a);box-shadow:0 8px 20px -10px #43e06a;}
.hl-submit.editing{background:linear-gradient(180deg,#ffd84d,#e0a800);color:#1a1300;box-shadow:0 8px 20px -10px #ffd84d;}
.hl-submit:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.hl-cancel{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:10px;font-size:12px;cursor:pointer;}
.hl-cancel:hover{color:var(--ink);}
.hl-tools{display:flex;gap:8px;margin-top:12px;}
.hl-ghost{flex:1;background:transparent;border:1px dashed var(--line);color:var(--mut);border-radius:9px;padding:8px;font-size:11px;cursor:pointer;}
.hl-ghost:hover{color:var(--ink);border-color:var(--mut);}
.hl-ghost.danger:hover{color:#ff9aa4;border-color:rgba(255,59,74,.4);}

/* em caixa */
.hl-caixa-val{font-family:Orbitron;font-weight:700;font-size:26px;color:#fff;}
.hl-caixa-sub{font-size:12px;color:var(--mut);margin-top:4px;}
.hl-caixa-edit{display:flex;gap:8px;margin-top:12px;}
.hl-caixa-edit input{flex:1;background:var(--void);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:14px;outline:none;}
.hl-caixa-edit input:focus{border-color:var(--gold);}
.hl-caixa-edit button{border:0;border-radius:9px;padding:0 16px;font-family:Orbitron;font-size:11px;letter-spacing:.08em;cursor:pointer;background:linear-gradient(180deg,#ffd84d,#e0a800);color:#1a1300;}

.hl-sabers{display:flex;flex-direction:column;gap:14px;}
.saber-row{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:12px;}
.saber-label{font-size:13px;color:var(--ink);font-weight:500;}
.saber-track{position:relative;display:flex;align-items:center;height:18px;}
.saber-hilt{position:relative;width:18px;height:16px;border-radius:3px;background:linear-gradient(180deg,#e6ebf4,#9aa3b6 52%,#4a5165);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);flex:0 0 auto;z-index:3;}
.saber-hilt::before{content:"";position:absolute;left:3px;top:3px;bottom:3px;width:2px;border-radius:2px;background:rgba(255,255,255,.55);}
.saber-hilt::after{content:"";position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:6px;height:11px;border-radius:1px;background:linear-gradient(180deg,#dfe5f0,#aab3c6);z-index:4;}
.saber-blade{height:9px;align-self:center;margin-left:-2px;border-radius:0 6px 6px 0;background:linear-gradient(90deg,#fff,var(--c) 26%);
  box-shadow:0 0 9px var(--c),0 0 20px var(--c);transform-origin:left;animation:ignite .5s cubic-bezier(.2,.8,.2,1) both;z-index:1;}
@keyframes ignite{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.saber-val{font-family:Orbitron;font-size:12px;color:#fff;min-width:84px;text-align:right;}

.hl-donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.hl-donut svg{width:140px;height:140px;flex:0 0 auto;}
.hl-donut-top{fill:#fff;font-family:Orbitron;font-size:20px;font-weight:700;}
.hl-donut-lbl{fill:var(--mut);font-size:8px;font-family:Inter;text-transform:uppercase;letter-spacing:.1em;}
.hl-legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;flex:1;min-width:140px;}
.hl-legend li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);}
.hl-legend li span{width:9px;height:9px;border-radius:2px;box-shadow:0 0 6px currentColor;}
.hl-legend li b{margin-left:auto;font-family:Orbitron;font-size:11px;color:var(--mut);font-weight:600;}

.hl-wlegend{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-bottom:12px;}
.hl-wlegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle;}
.hl-wlegend i.inc{background:#43e06a;}.hl-wlegend i.exp{background:#ff5563;}
.hl-weeks{display:flex;align-items:flex-end;gap:8px;height:150px;}
.hl-week{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.hl-week-bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;}
.hl-wbar{width:42%;max-width:18px;border-radius:4px 4px 0 0;min-height:2px;transition:height .5s;}
.hl-wbar.inc{background:linear-gradient(180deg,#56e784,#1f9e4a);box-shadow:0 0 10px -3px #43e06a;}
.hl-wbar.exp{background:linear-gradient(180deg,#ff6b78,#d61f2d);box-shadow:0 0 10px -3px #ff5563;}
.hl-week-lbl{font-size:10px;color:var(--mut);}

.hl-banks{display:flex;flex-direction:column;gap:11px;}
.hl-bank{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:10px;}
.hl-bank-name{font-size:13px;color:var(--ink);}
.hl-bank-bar{height:8px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;}
.hl-bank-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd84d,#ff9a3c);box-shadow:0 0 10px -2px #ffd84d;border-radius:99px;}
.hl-bank-val{font-family:Orbitron;font-size:11px;color:#fff;}

/* Quadro de patrimonio (fluxo x estoque) */
.hl-quadro{display:flex;flex-direction:column;gap:10px;}
.hl-qrow{display:grid;grid-template-columns:1.1fr 1fr 1fr;align-items:center;gap:12px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.hl-qrow.total{background:rgba(67,224,106,.07);border-color:rgba(67,224,106,.3);}
.hl-qrow.on{box-shadow:0 0 0 1px rgba(255,255,255,.18);}
.hl-qname{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);}
.hl-qname i{width:10px;height:10px;border-radius:99px;display:inline-block;}
.hl-qcell{display:flex;flex-direction:column;gap:2px;}
.hl-qcell small{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);}
.hl-qcell b{font-family:Orbitron;font-size:15px;color:#fff;}
.hl-qcell b.pos{color:#43e06a;} .hl-qcell b.neg{color:#ff3b4a;}

/* Evolucao do patrimonio (mes a mes) */
.hl-evo{display:flex;flex-direction:column;gap:8px;}
.hl-evohead,.hl-evorow{display:grid;grid-template-columns:90px 120px 1fr;align-items:center;gap:12px;}
.hl-evohead{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 4px 4px;}
.hl-evorow{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px;padding:9px 12px;}
.hl-evorow.on{box-shadow:0 0 0 1px rgba(46,166,255,.4);background:rgba(46,166,255,.06);}
.hl-evo-m{font-weight:600;color:var(--ink);font-size:13px;}
.hl-evo-res{font-family:Orbitron;font-size:12px;}
.hl-evo-res.pos{color:#43e06a;} .hl-evo-res.neg{color:#ff3b4a;}
.hl-evo-track{position:relative;height:22px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;display:flex;align-items:center;}
.hl-evo-track i{position:absolute;left:0;top:0;height:100%;border-radius:99px;opacity:.35;}
.hl-evo-track b{position:relative;font-family:Orbitron;font-size:11px;color:#fff;padding-left:10px;}

.hl-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;}
.hl-fact{background:var(--hull);border:1px solid var(--line);border-radius:12px;padding:14px;}
.hl-fact-label{font-size:11px;color:var(--mut);}
.hl-fact-value{display:block;font-family:Orbitron;font-weight:700;font-size:18px;color:#fff;margin:6px 0 3px;}
.hl-fact-note{font-size:11px;color:var(--mut);}

.hl-tx{display:flex;flex-direction:column;}
.hl-tx-scroll{max-height:520px;overflow-y:auto;overflow-x:hidden;margin-right:-6px;padding-right:6px;}
.hl-tx-scroll::-webkit-scrollbar{width:8px;}
.hl-tx-scroll::-webkit-scrollbar-thumb{background:rgba(120,150,210,.3);border-radius:99px;}
.hl-tx-scroll::-webkit-scrollbar-track{background:transparent;}
.hl-tx-scroll{scrollbar-width:thin;scrollbar-color:rgba(120,150,210,.3) transparent;}
.hl-txrow{display:grid;grid-template-columns:44px 12px 1fr auto auto auto;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.05);}
.hl-txrow:hover{background:rgba(255,255,255,.02);border-radius:8px;}
.hl-txrow:last-child{border-bottom:0;}
.hl-tx-date{font-family:Orbitron;font-size:11px;color:var(--mut);}
.hl-tx-dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 7px currentColor;}
.hl-tx-main{min-width:0;}
.hl-tx-main b{display:block;font-size:13px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hl-tx-main small{font-size:11px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hl-tx-val{font-family:Orbitron;font-size:13px;font-weight:600;text-align:right;}
.hl-tx-val.income{color:#7fe6a0;}.hl-tx-val.expense{color:#ff9aa4;}
.hl-tx-act{background:transparent;border:0;color:var(--mut);font-size:15px;cursor:pointer;line-height:1;border-radius:6px;width:26px;height:26px;}
.hl-tx-act:hover{color:var(--ink);background:rgba(255,255,255,.07);}
.hl-tx-act.del{font-size:18px;}
.hl-tx-act.del:hover{color:#ff9aa4;background:rgba(255,59,74,.1);}

.hl-empty{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13px;padding:14px 4px;}
.hl-empty-icon{color:var(--gold);font-size:16px;}

/* ---------- estado ---------- */
var state = {

/* ---------- camada de dados ---------- */
function lsLoad(){
  ["ricardo","lais"].forEach(function(p){
    try{
      var raw = localStorage.getItem("holocron:"+p);
      if(raw){ var o=JSON.parse(raw); state.data[p]={expenses:o.expenses||[],income:o.income||[],caixa:Number(o.caixa||0)}; }
    }catch(e){}
  });
}
function lsSave(p){ try{ localStorage.setItem("holocron:"+p, JSON.stringify(state.data[p])); }catch(e){} }

function rowToApp(r){
  if(r.tipo==="entrada") return { id:r.id, date:r.data, client:r.cliente, amount:Number(r.valor), note:r.nota||"" };
  return { id:r.id, date:r.data, category:r.categoria, bank:r.banco, forma:r.forma, amount:Number(r.valor), note:r.nota||"" };
}
function appToRow(perfil, kind, rec){
  return { perfil:perfil, tipo: kind==="expense"?"gasto":"entrada", data:rec.date, valor:rec.amount,
    categoria: kind==="expense"?(rec.category||null):null, banco: kind==="expense"?(rec.bank||null):null,
    forma: kind==="expense"?(rec.forma||null):null,
    cliente: kind==="income"?(rec.client||null):null, nota:rec.note||null };
}

async function dataLoad(){
  if(useSupabase){
    state.data = { ricardo:emptyP(), lais:emptyP() };
    var reg = await sb.from("registros").select("*").order("data",{ascending:true});
    if(reg.error) throw reg.error;
    (reg.data||[]).forEach(function(r){
      var p = state.data[r.perfil]; if(!p) return;
      if(r.tipo==="entrada") p.income.push(rowToApp(r)); else p.expenses.push(rowToApp(r));
    });
    var cx = await sb.from("caixa").select("*");
    if(!cx.error){ (cx.data||[]).forEach(function(c){ if(state.data[c.perfil]) state.data[c.perfil].caixa=Number(c.valor||0); }); }
  } else {
    lsLoad();
  }
}
async function addRecord(perfil, kind, rec){
  if(useSupabase){ var r=await sb.from("registros").insert(appToRow(perfil,kind,rec)); if(r.error) alert("Erro ao salvar: "+r.error.message); await dataLoad(); }
  else { state.data[perfil][kind==="expense"?"expenses":"income"].push(Object.assign({id:uid()},rec)); lsSave(perfil); }
}
async function updateRecord(perfil, kind, rec){
  if(useSupabase){ var r=await sb.from("registros").update(appToRow(perfil,kind,rec)).eq("id",rec.id); if(r.error) alert("Erro ao atualizar: "+r.error.message); await dataLoad(); }
  else { var key=kind==="expense"?"expenses":"income"; var arr=state.data[perfil][key]; var i=arr.findIndex(function(x){return x.id===rec.id;}); if(i>=0) arr[i]=rec; lsSave(perfil); }
}
async function deleteRecord(perfil, kind, id){
  if(useSupabase){ var r=await sb.from("registros").delete().eq("id",id); if(r.error) alert("Erro ao remover: "+r.error.message); await dataLoad(); }
  else { var key=kind==="expense"?"expenses":"income"; state.data[perfil][key]=state.data[perfil][key].filter(function(x){return x.id!==id;}); lsSave(perfil); }
}
async function setCaixa(perfil, valor){
  if(useSupabase){ var r=await sb.from("caixa").upsert({perfil:perfil,valor:valor,updated_at:new Date().toISOString()}); if(r.error) alert("Erro ao salvar caixa: "+r.error.message); await dataLoad(); }
  else { state.data[perfil].caixa=valor; lsSave(perfil); }
}

/* ---------- calculos ---------- */
function taggedSet(){
  function tag(arr,p){ return arr.map(function(x){ var o=Object.assign({},x); o._p=p; return o; }); }
  if(state.profile!=="ambos"){
    var d=state.data[state.profile];
    return { expenses:tag(d.expenses,state.profile), income:tag(d.income,state.profile), caixa:d.caixa };
  }
  return {
    expenses: tag(state.data.ricardo.expenses,"ricardo").concat(tag(state.data.lais.expenses,"lais")),
    income: tag(state.data.ricardo.income,"ricardo").concat(tag(state.data.lais.income,"lais")),
    caixa: Number(state.data.ricardo.caixa||0)+Number(state.data.lais.caixa||0)
  };
}
function compute(){
  var m=state.month, set=taggedSet();
  var mExp=set.expenses.filter(function(e){return (e.date||"").slice(0,7)===m;});
  var mInc=set.income.filter(function(e){return (e.date||"").slice(0,7)===m;});
  var totalExp=mExp.reduce(function(s,e){return s+Number(e.amount||0);},0);
  var totalInc=mInc.reduce(function(s,e){return s+Number(e.amount||0);},0);
  var balance=totalInc-totalExp, savings=totalInc>0?balance/totalInc*100:0;
  // ESTOQUE (patrimonio): saldo inicial manual + soma dos resultados ate o mes selecionado
  var saldoInicial=Number(set.caixa||0);
  var incAcum=set.income.filter(function(e){return (e.date||"").slice(0,7)<=m;}).reduce(function(s,e){return s+Number(e.amount||0);},0);
  var expAcum=set.expenses.filter(function(e){return (e.date||"").slice(0,7)<=m;}).reduce(function(s,e){return s+Number(e.amount||0);},0);
  var saldoAcumulado=saldoInicial+incAcum-expAcum;
  var pm=prevYM(m);
  var prevExp=set.expenses.filter(function(e){return (e.date||"").slice(0,7)===pm;}).reduce(function(s,e){return s+Number(e.amount||0);},0);
  var deltaExp=prevExp>0?(totalExp-prevExp)/prevExp*100:null;
  var rmap={}; mExp.forEach(function(e){var c=e.category||"Outros"; rmap[c]=(rmap[c]||0)+Number(e.amount||0);});
  var ranking=Object.keys(rmap).map(function(c){return {cat:c,val:rmap[c]};}).sort(function(a,b){return b.val-a.val;});
  var bmap={}; mExp.forEach(function(e){var b=e.bank||"Sem banco"; bmap[b]=(bmap[b]||0)+Number(e.amount||0);});
  var banks=Object.keys(bmap).map(function(b){return {bank:b,val:bmap[b]};}).sort(function(a,b){return b.val-a.val;});
  var fmap={}; mExp.forEach(function(e){var f=e.forma||"Não informado"; fmap[f]=(fmap[f]||0)+Number(e.amount||0);});
  var formas=Object.keys(fmap).map(function(f){return {forma:f,val:fmap[f]};}).sort(function(a,b){return b.val-a.val;});
  var weeks=[0,0,0,0,0]; mExp.forEach(function(e){weeks[weekOfMonth(e.date)-1]+=Number(e.amount||0);});
  var weeksInc=[0,0,0,0,0]; mInc.forEach(function(e){weeksInc[weekOfMonth(e.date)-1]+=Number(e.amount||0);});
  var biggest=mExp.slice().sort(function(a,b){return b.amount-a.amount;})[0];
  var activeWeeks=weeks.filter(function(w){return w>0;}).length;
  var avgWeek=totalExp/(activeWeeks||1);
  var tx=mExp.map(function(x){var o=Object.assign({},x);o.kind="expense";return o;})
    .concat(mInc.map(function(x){var o=Object.assign({},x);o.kind="income";return o;}))
    .sort(function(a,b){return a.date<b.date?1:-1;});
  return {mExp:mExp,mInc:mInc,totalExp:totalExp,totalInc:totalInc,balance:balance,savings:savings,
    deltaExp:deltaExp,prevYM:pm,ranking:ranking,banks:banks,formas:formas,weeks:weeks,weeksInc:weeksInc,biggest:biggest,
    avgWeek:avgWeek,activeWeeks:activeWeeks,tx:tx,caixa:set.caixa,
    saldoInicial:saldoInicial,saldoAcumulado:saldoAcumulado};
}

/* ---------- fluxo (mes) x estoque (acumulado) por conjunto de dados ---------- */
function fluxoEstoque(d, m){
  function sum(arr,pred){ return arr.filter(pred).reduce(function(s,e){return s+Number(e.amount||0);},0); }
  var inc=d.income||[], exp=d.expenses||[];
  var resMes = sum(inc,function(e){return (e.date||"").slice(0,7)===m;}) - sum(exp,function(e){return (e.date||"").slice(0,7)===m;});
  var acum = Number(d.caixa||0) + sum(inc,function(e){return (e.date||"").slice(0,7)<=m;}) - sum(exp,function(e){return (e.date||"").slice(0,7)<=m;});
  return { res:resMes, acum:acum, inicial:Number(d.caixa||0) };
}
// quadro por responsavel + consolidado, no mes selecionado
function quadroPatrimonio(m){
  var r=fluxoEstoque(state.data.ricardo,m), l=fluxoEstoque(state.data.lais,m);
  return [
    {id:"ricardo",nome:"Ricardo",res:r.res,acum:r.acum},
    {id:"lais",nome:"Lais",res:l.res,acum:l.acum},
    {id:"ambos",nome:"Galáxia",res:r.res+l.res,acum:r.acum+l.acum}
  ];
}
// evolucao mes a mes (resultado e acumulado ao fim de cada mes) do conjunto selecionado
function evolucao(set){
  function sum(arr,pred){ return arr.filter(pred).reduce(function(s,e){return s+Number(e.amount||0);},0); }
  var mset={};
  (set.income||[]).forEach(function(e){var ym=(e.date||"").slice(0,7); if(ym) mset[ym]=true;});
  (set.expenses||[]).forEach(function(e){var ym=(e.date||"").slice(0,7); if(ym) mset[ym]=true;});
  var months=Object.keys(mset).sort();
  var acum=Number(set.caixa||0);
  return months.map(function(ym){
    var inc=sum(set.income,function(e){return (e.date||"").slice(0,7)===ym;});
    var exp=sum(set.expenses,function(e){return (e.date||"").slice(0,7)===ym;});
    var res=inc-exp; acum+=res;
    return {ym:ym, inc:inc, exp:exp, res:res, acum:acum};
  });
}

/* ---------- selects de data (PT) ---------- */
function monthOpts(sel){ var o=""; for(var i=1;i<=12;i++){o+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+MESES[i-1]+'</option>';} return o; }
function yearOpts(sel){ var y=new Date().getFullYear(),o=""; for(var i=y-2;i<=y+1;i++){o+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+i+'</option>';} return o; }
function isoToBR(iso){ if(!iso) return ""; var a=iso.split("-"); return a[2]+"/"+a[1]+"/"+a[0]; }
function brToIso(br){ var m=String(br||"").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(!m) return null; var d=+m[1],mo=+m[2],y=+m[3]; if(mo<1||mo>12||d<1||d>31) return null; return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
function defaultDateBR(){ var t=new Date(); return String(Math.min(28,t.getDate())).padStart(2,"0")+"/"+state.month.slice(5,7)+"/"+state.month.slice(0,4); }
function dateField(prefix, isoOrNull){
  var v = isoOrNull ? isoToBR(isoOrNull) : defaultDateBR();
  return '<input type="text" id="'+prefix+'-date" class="hl-datefield" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" value="'+v+'">';
}
function readDate(prefix){ return brToIso(document.getElementById(prefix+"-date").value); }

function emptyBox(text){ return '<div class="hl-empty"><span class="hl-empty-icon">✶</span>'+text+'</div>'; }

function donutSVG(ranking,total){
  var r=54,cx=70,cy=70,circ=2*Math.PI*r,acc=0;
  var segs=ranking.map(function(d,i){var f=d.val/total;var s={cat:d.cat,val:d.val,color:colorFor(d.cat,i),dash:f*circ,offset:-acc*circ};acc+=f;return s;});
  var top=ranking[0];
  var circles=segs.map(function(s){
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="14" stroke-dasharray="'+s.dash+' '+(circ-s.dash)+'" stroke-dashoffset="'+s.offset+'" transform="rotate(-90 '+cx+' '+cy+')" style="filter:drop-shadow(0 0 4px '+s.color+')"></circle>';
  }).join("");
  var legend=segs.slice(0,7).map(function(s){return '<li><span style="background:'+s.color+'"></span>'+esc(s.cat)+'<b>'+pct(s.val/total*100)+'</b></li>';}).join("");
  return '<div class="hl-donut"><svg viewBox="0 0 140 140"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="14"></circle>'
    +circles+'<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" class="hl-donut-top">'+pct(top.val/total*100)+'</text>'
    +'<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" class="hl-donut-lbl">'+esc(top.cat)+'</text></svg><ul class="hl-legend">'+legend+'</ul></div>';
}

function bankSelect(value){
  var list=BANK_SUGGESTIONS.slice();

  var sel=value||list[0];
  return '<select id="ex-bank">'+list.map(function(b){ return '<option value="'+esc(b)+'"'+(b===sel?' selected':'')+'>'+esc(b)+'</option>'; }).join("")+'</select>';
}
function formaSelect(value){
  var list=FORMAS.slice();
  if(value && list.indexOf(value)<0) list.unshift(value);
  var sel=value||"PIX";
  return '<select id="ex-forma">'+list.map(function(f){ return '<option value="'+esc(f)+'"'+(f===sel?' selected':'')+'>'+esc(f)+'</option>'; }).join("")+'</select>';
}

function expenseForm(){
  var ed=state.editing&&state.editing.kind==="expense"?state.editing:null;
  return '<div class="hl-form">'
    +'<label class="hl-field"><span>Data do pagamento</span>'+dateField("ex", ed?ed.date:null)+'</label>'
    +'<label class="hl-field"><span>Valor (R$)</span><input type="number" inputmode="decimal" id="ex-amount" placeholder="0,00" value="'+(ed?ed.amount:"")+'"></label>'
    +'<label class="hl-field"><span>Categoria</span>'+catSelect(ed?ed.category:"Mercado")+'</label>'
    +'<label class="hl-field"><span>Banco</span>'+bankSelect(ed?ed.bank:"")+'</label>'
    +'<label class="hl-field"><span>Forma de pagamento</span>'+formaSelect(ed?ed.forma:"")+'</label>'
    +'<label class="hl-field"><span>Nota (opcional)</span><input id="ex-note" placeholder="ex: feira da semana" value="'+(ed?esc(ed.note||""):"")+'"></label>'
    +(ed
      ? '<button class="hl-submit editing" data-act="save-expense">Salvar alteração</button><button class="hl-cancel" data-act="cancel-edit">Cancelar</button>'
      : '<button class="hl-submit" data-act="add-expense">Registrar gasto</button>')
  +'</div>';
}
function incomeForm(){
  var ed=state.editing&&state.editing.kind==="income"?state.editing:null;
  return '<div class="hl-form">'
    +'<label class="hl-field"><span>Data</span>'+dateField("in", ed?ed.date:null)+'</label>'
    +'<label class="hl-field"><span>Valor (R$)</span><input type="number" inputmode="decimal" id="in-amount" placeholder="0,00" value="'+(ed?ed.amount:"")+'"></label>'
    +'<label class="hl-field"><span>Cliente</span><input id="in-client" placeholder="ex: Dra. Vivian, FX..." value="'+(ed?esc(ed.client||""):"")+'"></label>'
    +'<label class="hl-field"><span>Nota (opcional)</span><input id="in-note" placeholder="ex: parcela 1/3" value="'+(ed?esc(ed.note||""):"")+'"></label>'
    +(ed
      ? '<button class="hl-submit editing" data-act="save-income">Salvar alteração</button><button class="hl-cancel" data-act="cancel-edit">Cancelar</button>'

function caixaPanel(c){
  var isAmbos=state.profile==="ambos";
  var body;
  if(isAmbos){
    body='<div class="hl-caixa-val">'+money(c.saldoInicial)+'</div>'
      +'<div class="hl-caixa-sub">soma do ponto de partida de Ricardo e Lais</div>'
      +'<div class="hl-caixa-sub">patrimônio em '+ymLabel(state.month)+': <b style="color:#cfe0ff">'+money(c.saldoAcumulado)+'</b></div>';
  } else if(state.caixaEdit){
    body='<div class="hl-caixa-edit"><input type="number" inputmode="decimal" id="caixa-input" placeholder="0,00" value="'+c.caixa+'"><button data-act="caixa-save">Salvar</button></div>';
  } else {
    body='<div class="hl-caixa-val">'+money(c.saldoInicial)+'</div>'
      +'<div class="hl-caixa-sub">quanto já tinha guardado antes de começar</div>'
      +'<div class="hl-caixa-sub">patrimônio em '+ymLabel(state.month)+': <b style="color:#cfe0ff">'+money(c.saldoAcumulado)+'</b></div>'
      +'<div class="hl-tools"><button class="hl-ghost" data-act="caixa-edit">Ajustar ponto de partida</button></div>';

/* ---------- login ---------- */
function renderLogin(){
  document.getElementById("app").innerHTML=
    '<div class="hl-login"><div class="hl-login-card">'
      +'<h1 class="hl-login-title">Acesso</h1>'
      +'<p class="hl-login-sub">Identifique-se, piloto.</p>'
      +'<label class="hl-field"><span>Usuário</span><input id="login-user" autocomplete="username" placeholder="ricardo ou lais"></label>'
      +'<label class="hl-field"><span>Senha</span><input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••"></label>'
      +(state.loginError?'<div class="hl-login-err">'+state.loginError+'</div>':'')
      +'<button class="hl-submit" data-act="login">Entrar</button>'
    +'</div></div>';
  var u=document.getElementById("login-user"); if(u) u.focus();
}
function doLogin(){
  var u=(document.getElementById("login-user").value||"").trim().toLowerCase();
  var p=(document.getElementById("login-pass").value||"").trim();
  if(USERS[u]!==undefined && USERS[u]===p){
    state.user=u; state.profile=u; state.authed=true; state.loginError="";
    try{ localStorage.setItem("holocron:session", u); }catch(e){}
    route();
  } else {
    state.loginError="Usuário ou senha incorretos.";
    renderLogin();
  }
}
function doLogout(){
  state.authed=false; state.user=null; state.editing=null; state.caixaEdit=false; state.loginError="";
  try{ localStorage.removeItem("holocron:session"); }catch(e){}
  route();
}
function route(){ if(state.authed) render(); else renderLogin(); }

/* ---------- render ---------- */
function render(){
  var c=compute();
  var me=PROFILES.filter(function(p){return p.id===state.profile;})[0];
  var isAmbos=state.profile==="ambos";
  var good=c.balance>=0;
  var statusLine=good
    ? (c.totalInc===0&&c.totalExp===0?"Galáxia em silêncio. Lance o primeiro registro.":"A Força está com você. Saldo positivo neste ciclo.")
    : "Território Sith. Os gastos passaram das entradas.";

  var cm=Number(state.month.slice(5,7)), cy=Number(state.month.slice(0,4));
  var tabs=PROFILES.map(function(p){
    var on=state.profile===p.id;
    return '<button class="hl-tab '+(on?"on":"")+'" '+(on?'style="--c:'+p.color+'"':'')+' data-act="tab" data-id="'+p.id+'"><span class="hl-tab-dot" style="background:'+p.color+'"></span>'+p.name+'</button>';
  }).join("");

  var rankMax=c.ranking.length?c.ranking[0].val:1;
  var sabers=c.ranking.length===0?emptyBox("Nenhum gasto neste ciclo. Lance o primeiro à esquerda.")
    :'<div class="hl-sabers">'+c.ranking.map(function(r,i){var col=colorFor(r.cat,i);

  var donut=c.ranking.length===0?emptyBox("Sem dados para o anel."):donutSVG(c.ranking,c.totalExp);

  var weekMax=Math.max.apply(null,c.weeks.concat(c.weeksInc).concat([1]));
  var weeksHtml=(c.totalExp===0 && c.totalInc===0)?emptyBox("Sem registros no ciclo.")
    :'<div class="hl-wlegend"><span><i class="inc"></i>Entrou</span><span><i class="exp"></i>Saiu</span></div><div class="hl-weeks">'+c.weeks.map(function(w,i){
      var inc=c.weeksInc[i];
      return '<div class="hl-week"><div class="hl-week-bars">'
        +'<span class="hl-wbar inc" style="height:'+(inc/weekMax*100)+'%" title="Entrou: '+money(inc)+'"></span>'
        +'<span class="hl-wbar exp" style="height:'+(w/weekMax*100)+'%" title="Saiu: '+money(w)+'"></span>'
        +'</div><span class="hl-week-lbl">Sem '+(i+1)+'</span></div>';}).join("")+'</div>';

  var banksHtml=c.banks.length===0?emptyBox("Sem gastos por banco neste ciclo.")
    :'<div class="hl-banks">'+c.banks.map(function(b){
      return '<div class="hl-bank"><span class="hl-bank-name">'+esc(b.bank)+'</span><span class="hl-bank-bar"><i style="width:'+(b.val/c.banks[0].val*100)+'%"></i></span><span class="hl-bank-val">'+money(b.val)+'</span></div>';}).join("")+'</div>';

  var formasHtml=c.formas.length===0?emptyBox("Sem gastos por forma neste ciclo.")
    :'<div class="hl-banks">'+c.formas.map(function(f){
      return '<div class="hl-bank"><span class="hl-bank-name">'+esc(f.forma)+'</span><span class="hl-bank-bar"><i style="width:'+(f.val/c.formas[0].val*100)+'%"></i></span><span class="hl-bank-val">'+money(f.val)+'</span></div>';}).join("")+'</div>';

  var txHtml=c.tx.length===0?emptyBox("Nada registrado neste ciclo ainda.")
    :'<div class="hl-tx">'+c.tx.map(function(t){
      var title=t.kind==="income"?(t.client||"Entrada"):t.category;
      var sub=t.kind==="income"?(t.note||"recompensa"):[t.note,t.bank,t.forma].filter(Boolean).join(" · ");
      var dot=t.kind==="income"?"#43e06a":colorFor(t.category,0);
      return '<div class="hl-txrow '+t.kind+'"><span class="hl-tx-date">'+t.date.slice(8,10)+'/'+t.date.slice(5,7)+'</span><span class="hl-tx-dot" style="background:'+dot+'"></span>'
        +'<span class="hl-tx-main"><b>'+esc(title)+'</b><small>'+esc(sub)+'</small></span><span class="hl-tx-val '+t.kind+'">'+(t.kind==="income"?"+":"\u2212")+' '+money(t.amount)+'</span>'
        +'<button class="hl-tx-act" data-act="edit" data-id="'+t.id+'" data-kind="'+t.kind+'" data-p="'+t._p+'" title="Editar">&#9998;</button>'
        +'<button class="hl-tx-act del" data-act="del" data-id="'+t.id+'" data-kind="'+t.kind+'" data-p="'+t._p+'" title="Remover">&times;</button></div>';}).join("")+'</div>';

  var editingCls=state.editing?" editing":"";
  // QUADRO: fluxo (resultado do mes) x estoque (acumulado) por responsavel + consolidado
  var quadro=quadroPatrimonio(state.month);
  var quadroHtml='<div class="hl-quadro">'+quadro.map(function(q){
    var prof=PROFILES.filter(function(p){return p.id===q.id;})[0];
    var col=prof?prof.color:"#7d8aa8";
    return '<div class="hl-qrow'+(q.id==="ambos"?" total":"")+(q.id===state.profile?" on":"")+'">'
      +'<span class="hl-qname"><i style="background:'+col+'"></i>'+q.nome+'</span>'
      +'<span class="hl-qcell"><small>resultado do mês</small><b class="'+(q.res>=0?"pos":"neg")+'">'+(q.res>=0?"+ ":"− ")+money(Math.abs(q.res))+'</b></span>'
      +'<span class="hl-qcell"><small>saldo acumulado</small><b>'+money(q.acum)+'</b></span>'
      +'</div>';
  }).join("")+'</div>';

  // EVOLUCAO: resultado e patrimonio acumulado ao fim de cada mes (conjunto selecionado)
  var evo=evolucao(taggedSet());
  var evoHtml;
  if(evo.length===0){ evoHtml=emptyBox("Sem meses registrados ainda."); }
  else {
    var maxA=Math.max.apply(null,evo.map(function(x){return Math.abs(x.acum);}).concat([1]));
    evoHtml='<div class="hl-evo"><div class="hl-evohead"><span>Mês</span><span>Resultado</span><span>Patrimônio acumulado</span></div>'
      +evo.map(function(x){
        return '<div class="hl-evorow'+(x.ym===state.month?" on":"")+'">'
          +'<span class="hl-evo-m">'+ymLabel(x.ym)+'</span>'
          +'<span class="hl-evo-res '+(x.res>=0?"pos":"neg")+'">'+(x.res>=0?"+ ":"− ")+money(Math.abs(x.res))+'</span>'
          +'<span class="hl-evo-track"><i style="width:'+(Math.abs(x.acum)/maxA*100)+'%;background:'+(x.acum>=0?"#43e06a":"#ff3b4a")+'"></i><b>'+money(x.acum)+'</b></span>'
          +'</div>';

  }

  var leftCol=isAmbos
    ? '<section class="hl-panel"><div class="hl-panel-head"><div><h2>Sala de comando</h2></div></div><p class="hl-note">A Galáxia mostra a visão combinada de Ricardo e Lais. Para lançar ou editar, escolha um dos dois esquadrões acima. Editar um registro daqui leva você direto pro esquadrão dono dele.</p></section>'
    : '<section class="hl-panel'+editingCls+'"><div class="hl-panel-head"><div><h2>'+(state.editing?"Editar registro":"Novo registro")+'</h2></div>'
      +(state.editing?'':'<div class="hl-switch"><button class="'+(state.mode==="expense"?"on":"")+'" data-act="mode" data-id="expense">Gasto</button><button class="'+(state.mode==="income"?"on":"")+'" data-act="mode" data-id="income">Entrada</button></div>')
      +'</div>'+(state.mode==="expense"?expenseForm():incomeForm())
      +'</section>';

  document.getElementById("app").innerHTML=
    '<header class="hl-head"><div><h1 class="hl-title">'+esc(me.display||me.name)+'</h1></div>'
      +'<div class="hl-head-right"><div class="hl-ciclo"><label>Ciclo</label><div class="row"><select id="ciclo-mes">'+monthOpts(cm)+'</select><select id="ciclo-ano">'+yearOpts(cy)+'</select></div></div>'
      +'<button class="hl-logout" data-act="logout" title="Sair">Sair</button></div></header>'
    +'<nav class="hl-tabs">'+tabs+'</nav>'
    +'<div class="hl-status '+(good?"good":"bad")+'">'+statusLine+'</div>'
    +'<section class="hl-kpis">'
      +hud("Recompensas","entradas de clientes",money(c.totalInc),"#43e06a")
      +hud("Lado sombrio","gastos do ciclo",money(c.totalExp),"#ff3b4a",c.deltaExp!=null?((c.deltaExp>=0?"\u25B2":"\u25BC")+" "+pct(Math.abs(c.deltaExp))+" vs "+ymLabel(c.prevYM)):null,c.deltaExp!=null&&c.deltaExp<0)
      +hud("A Força","saldo do ciclo",money(c.balance),good?"#2ea6ff":"#ff3b4a")
      +hud("Patrimônio","saldo acumulado até "+ymLabel(state.month),money(c.saldoAcumulado),c.saldoAcumulado>=0?"#43e06a":"#ff3b4a")
    +'</section>'
    +'<div class="hl-grid"><div class="hl-col">'+leftCol+caixaPanel(c)
      +'<section class="hl-panel"><div class="hl-panel-head"><div><h2>Por banco</h2><p>visão de apoio</p></div></div>'+banksHtml+'</section>'
      +'<section class="hl-panel"><div class="hl-panel-head"><div><h2>Por forma de pagamento</h2><p>PIX, cartão, etc.</p></div></div>'+formasHtml+'</section>'
      +'<section class="hl-panel"><div class="hl-panel-head"><div><h2>Mapa de tipos</h2><p>distribuição de gastos</p></div></div>'+donut+'</section>'
      +'<section class="hl-panel"><div class="hl-panel-head"><div><h2>Linha do tempo</h2><p>entrou x saiu por semana</p></div></div>'+weeksHtml+'</section></div>'
      +'<div class="hl-col wide">'
        +'<section class="hl-panel"><div class="hl-panel-head"><div><h2>Patrimônio por responsável</h2><p>fluxo (resultado do mês) x estoque (acumulado) em '+ymLabel(state.month)+'</p></div></div>'+quadroHtml+'</section>'
        +'<section class="hl-panel"><div class="hl-panel-head"><div><h2>Evolução do patrimônio</h2><p>quanto existia no fechamento de cada mês'+(isAmbos?" (Galáxia)":"")+'</p></div></div>'+evoHtml+'</section>'
        +'<section class="hl-panel"><div class="hl-panel-head"><div><h2>Os mais procurados</h2><p>onde a Força mais escapou neste ciclo</p></div></div>'+sabers+'</section>'
        +'<section class="hl-panel"><div class="hl-panel-head"><div><h2>Registro de bordo</h2><p>movimentos de '+ymLabel(state.month)+'</p></div></div><div class="hl-tx-scroll">'+txHtml+'</div></section>'
      +'</div></div>'
    +'<footer class="hl-foot">'+(useSupabase?'<span class="on">● Supabase conectado</span> · dados na nuvem':'<span class="off">● Modo local</span> · salvando neste navegador')+'</footer>';
}

/* ---------- leitura de formularios ---------- */
function readExpense(){
  var amount=Number(document.getElementById("ex-amount").value);
  if(!(amount>0)){ alert("Informe um valor maior que zero."); return null; }
  var date=readDate("ex");
  if(!date){ alert("Data inválida. Use o formato dd/mm/aaaa."); return null; }
  return { date:date, category:document.getElementById("ex-cat").value, bank:document.getElementById("ex-bank").value.trim(), forma:document.getElementById("ex-forma").value, amount:amount, note:document.getElementById("ex-note").value.trim() };
}
function readIncome(){
  var amount=Number(document.getElementById("in-amount").value);
  if(!(amount>0)){ alert("Informe um valor maior que zero."); return null; }
  var date=readDate("in");
  if(!date){ alert("Data inválida. Use o formato dd/mm/aaaa."); return null; }
  return { date:date, client:(document.getElementById("in-client").value||"Cliente").trim(), amount:amount, note:document.getElementById("in-note").value.trim() };
}
function startEdit(rec){
  state.profile=rec._p;       // se estava em "ambos", vai pro dono
  state.mode=rec.kind;
  state.editing=Object.assign({},rec);
  state.caixaEdit=false;
  render();
}
function cancelEdit(){ state.editing=null; render(); }

/* ---------- eventos ---------- */
var app=document.getElementById("app");

app.addEventListener("click", async function(ev){
  var btn=ev.target.closest("[data-act]"); if(!btn) return;
  var act=btn.getAttribute("data-act"), id=btn.getAttribute("data-id");

  if(act==="login"){ doLogin(); return; }
  if(act==="logout"){ doLogout(); return; }
  if(act==="tab"){ state.profile=id; state.editing=null; state.caixaEdit=false; render(); return; }
  if(act==="mode"){ state.mode=id; render(); return; }
  if(act==="cancel-edit"){ cancelEdit(); return; }

  if(act==="add-expense"){ var r=readExpense(); if(!r) return; await addRecord(state.profile,"expense",r); render(); return; }
  if(act==="add-income"){ var ri=readIncome(); if(!ri) return; await addRecord(state.profile,"income",ri); render(); return; }
  if(act==="save-expense"){ var re=readExpense(); if(!re) return; re.id=state.editing.id; await updateRecord(state.profile,"expense",re); cancelEdit(); return; }
  if(act==="save-income"){ var rs=readIncome(); if(!rs) return; rs.id=state.editing.id; await updateRecord(state.profile,"income",rs); cancelEdit(); return; }

  if(act==="edit"){
    var kind=btn.getAttribute("data-kind"), p=btn.getAttribute("data-p");
    var arr=state.data[p][kind==="expense"?"expenses":"income"];
    var rec=arr.filter(function(x){return x.id===id;})[0];
    if(rec){ var copy=Object.assign({},rec); copy.kind=kind; copy._p=p; startEdit(copy); }
    return;
  }
  if(act==="del"){
    var k=btn.getAttribute("data-kind"), pp=btn.getAttribute("data-p");
    if(!confirm("Remover este registro?")) return;
    await deleteRecord(pp,k,id); render(); return;
  }
  if(act==="seed"){ await loadSeed(); return; }
  if(act==="clear"){ if(state.profile==="ambos")return; if(!confirm("Apagar todos os lançamentos deste perfil? Essa ação não tem volta.")) return;
    var d=state.data[state.profile];
    if(useSupabase){ await sb.from("registros").delete().eq("perfil",state.profile); await dataLoad(); }
    else { state.data[state.profile]=emptyP(); lsSave(state.profile); }
    render(); return; }

  if(act==="caixa-edit"){ state.caixaEdit=true; render(); return; }
  if(act==="caixa-save"){ var v=Number(document.getElementById("caixa-input").value)||0; await setCaixa(state.profile,v); state.caixaEdit=false; render(); return; }
});

app.addEventListener("input", function(ev){
  if(ev.target.id==="ex-date"||ev.target.id==="in-date"){
    var v=ev.target.value.replace(/\D/g,"").slice(0,8), out=v;
    if(v.length>4) out=v.slice(0,2)+"/"+v.slice(2,4)+"/"+v.slice(4);
    else if(v.length>2) out=v.slice(0,2)+"/"+v.slice(2);
    ev.target.value=out;
  }
});
app.addEventListener("change", function(ev){
  if(ev.target.id==="ciclo-mes"||ev.target.id==="ciclo-ano"){
    var m=document.getElementById("ciclo-mes").value, y=document.getElementById("ciclo-ano").value;
    state.month=y+"-"+String(m).padStart(2,"0"); state.editing=null; render();
  }
});
app.addEventListener("keydown", function(ev){
  if(ev.key==="Enter" && (ev.target.id==="login-user"||ev.target.id==="login-pass")){ doLogin(); return; }
  if(ev.key==="Enter" && (ev.target.id==="ex-amount"||ev.target.id==="in-amount"||ev.target.id==="ex-note"||ev.target.id==="in-note"||ev.target.id==="caixa-input")){
    var map={"ex-amount":state.editing?"save-expense":"add-expense","ex-note":state.editing?"save-expense":"add-expense","in-amount":state.editing?"save-income":"add-income","in-note":state.editing?"save-income":"add-income","caixa-input":"caixa-save"};
    var b=document.querySelector('[data-act="'+map[ev.target.id]+'"]'); if(b) b.click();
  }
});

/* ---------- boot ---------- */
async function boot(){
  if(SUPABASE_URL && SUPABASE_KEY && window.supabase){
    try{ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); useSupabase=true; }catch(e){ useSupabase=false; }
  }
  try{ await dataLoad(); }catch(e){ useSupabase=false; lsLoad(); }
  try{ var sess=localStorage.getItem("holocron:session"); if(sess && USERS[sess]!==undefined){ state.user=sess; state.profile=sess; state.authed=true; } }catch(e){}
  route();
}
boot();
</script>
