<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Financeira</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='8' width='26' height='16' rx='3' fill='%2343c06a'/><rect x='5' y='10' width='22' height='12' rx='2' fill='none' stroke='%232a8a48' stroke-width='1.5'/><circle cx='16' cy='16' r='4.5' fill='%23eafff0'/><text x='16' y='19.5' text-anchor='middle' font-family='Arial, sans-serif' font-weight='700' font-size='8' fill='%232a8a48'>$</text><circle cx='8' cy='12' r='1' fill='%23eafff0'/><circle cx='24' cy='20' r='1' fill='%23eafff0'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;}
:root{--void:#05060c;--hull:#0d1322;--steel:#19233a;--line:rgba(120,150,210,.16);--ink:#e8eefb;--mut:#8a99bd;--gold:#ffd84d;}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 700px at 70% -10%,#101a33 0%,var(--void) 55%);
  color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;}
.hl-stars{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(1.4px 1.4px at 8% 12%,#fff,transparent),radial-gradient(1px 1px at 22% 30%,#cfe0ff,transparent),radial-gradient(1.6px 1.6px at 35% 9%,#fff,transparent),radial-gradient(1px 1px at 48% 22%,#fff,transparent),radial-gradient(1.3px 1.3px at 61% 14%,#dbe6ff,transparent),radial-gradient(1px 1px at 73% 33%,#fff,transparent),radial-gradient(1.6px 1.6px at 86% 11%,#fff,transparent),radial-gradient(1px 1px at 92% 47%,#cfe0ff,transparent),radial-gradient(1.2px 1.2px at 14% 58%,#fff,transparent),radial-gradient(1px 1px at 30% 72%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 64%,#dbe6ff,transparent),radial-gradient(1px 1px at 57% 80%,#fff,transparent),radial-gradient(1.3px 1.3px at 69% 60%,#fff,transparent),radial-gradient(1.6px 1.6px at 82% 78%,#fff,transparent),radial-gradient(1px 1px at 95% 66%,#cfe0ff,transparent),radial-gradient(1.2px 1.2px at 5% 88%,#fff,transparent),radial-gradient(1px 1px at 16% 18%,#fff,transparent),radial-gradient(1.3px 1.3px at 27% 6%,#dbe6ff,transparent),radial-gradient(1px 1px at 40% 36%,#fff,transparent),radial-gradient(1.5px 1.5px at 53% 12%,#fff,transparent),radial-gradient(1px 1px at 66% 42%,#cfe0ff,transparent),radial-gradient(1.4px 1.4px at 78% 20%,#fff,transparent),radial-gradient(1px 1px at 88% 38%,#fff,transparent),radial-gradient(1.2px 1.2px at 10% 44%,#dbe6ff,transparent),radial-gradient(1px 1px at 24% 86%,#fff,transparent),radial-gradient(1.3px 1.3px at 38% 78%,#fff,transparent),radial-gradient(1px 1px at 51% 94%,#cfe0ff,transparent),radial-gradient(1.5px 1.5px at 64% 74%,#fff,transparent),radial-gradient(1px 1px at 77% 90%,#fff,transparent),radial-gradient(1.3px 1.3px at 90% 82%,#dbe6ff,transparent),radial-gradient(1px 1px at 2% 64%,#fff,transparent),radial-gradient(1.2px 1.2px at 99% 54%,#fff,transparent);
  animation:tw1 7s ease-in-out infinite alternate;}
.hl-stars::before{content:"";position:absolute;inset:0;opacity:.55;
  background-image:radial-gradient(1px 1px at 12% 22%,#aab8d8,transparent),radial-gradient(1px 1px at 26% 50%,#bcc8e6,transparent),radial-gradient(1px 1px at 40% 16%,#aab8d8,transparent),radial-gradient(1px 1px at 54% 40%,#bcc8e6,transparent),radial-gradient(1px 1px at 67% 24%,#aab8d8,transparent),radial-gradient(1px 1px at 79% 52%,#bcc8e6,transparent),radial-gradient(1px 1px at 90% 30%,#aab8d8,transparent),radial-gradient(1px 1px at 3% 40%,#bcc8e6,transparent),radial-gradient(1px 1px at 18% 82%,#aab8d8,transparent),radial-gradient(1px 1px at 33% 92%,#bcc8e6,transparent),radial-gradient(1px 1px at 50% 72%,#aab8d8,transparent),radial-gradient(1px 1px at 63% 92%,#bcc8e6,transparent),radial-gradient(1px 1px at 76% 70%,#aab8d8,transparent),radial-gradient(1px 1px at 88% 90%,#bcc8e6,transparent),radial-gradient(1px 1px at 97% 84%,#aab8d8,transparent),radial-gradient(1px 1px at 9% 68%,#bcc8e6,transparent),radial-gradient(1px 1px at 6% 8%,#aab8d8,transparent),radial-gradient(1px 1px at 20% 38%,#bcc8e6,transparent),radial-gradient(1px 1px at 31% 64%,#aab8d8,transparent),radial-gradient(1px 1px at 45% 28%,#bcc8e6,transparent),radial-gradient(1px 1px at 58% 56%,#aab8d8,transparent),radial-gradient(1px 1px at 71% 36%,#bcc8e6,transparent),radial-gradient(1px 1px at 84% 62%,#aab8d8,transparent),radial-gradient(1px 1px at 94% 18%,#bcc8e6,transparent),radial-gradient(1px 1px at 14% 76%,#aab8d8,transparent),radial-gradient(1px 1px at 38% 50%,#bcc8e6,transparent),radial-gradient(1px 1px at 55% 84%,#aab8d8,transparent),radial-gradient(1px 1px at 70% 80%,#bcc8e6,transparent),radial-gradient(1px 1px at 83% 76%,#aab8d8,transparent),radial-gradient(1px 1px at 96% 70%,#bcc8e6,transparent);
  animation:tw2 11s ease-in-out infinite alternate;}
@keyframes tw1{from{opacity:.7}to{opacity:1}}
@keyframes tw2{from{opacity:.3}to{opacity:.65}}
.hl-wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 20px 60px;}

.hl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
.hl-eyebrow{font-family:Orbitron;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);opacity:.85;}
.hl-title{font-family:Orbitron;font-weight:900;font-size:34px;line-height:1;margin:6px 0 4px;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff,#9fc0ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hl-sub{color:var(--mut);font-size:13px;margin:0;}
.hl-ciclo{display:flex;flex-direction:column;gap:4px;}
.hl-ciclo label{font-family:Orbitron;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--mut);}
.hl-ciclo .row{display:flex;gap:6px;}
select,input{font-family:Inter;}
.hl-ciclo select{background:var(--hull);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;}

.hl-tabs{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap;}
.hl-tab{display:flex;align-items:center;gap:8px;background:var(--hull);border:1px solid var(--line);color:var(--mut);
  padding:9px 16px;border-radius:999px;font-family:Orbitron;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.18s;}
.hl-tab:hover{color:var(--ink);}
.hl-tab.on{color:#fff;border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px -6px var(--c);background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);}
.hl-tab-dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor;}

.hl-status{font-family:Orbitron;font-size:12px;letter-spacing:.08em;padding:10px 14px;border-radius:10px;margin-bottom:14px;border:1px solid var(--line);}
.hl-status.good{color:#9be8b4;background:rgba(67,224,106,.07);border-color:rgba(67,224,106,.25);}
.hl-status.bad{color:#ff9aa4;background:rgba(255,59,74,.07);border-color:rgba(255,59,74,.25);}

.hl-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.hl-hud{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--hull);border:1px solid var(--line);
  border-radius:14px;padding:16px 16px 14px;overflow:hidden;}
.hl-hud::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--a);box-shadow:0 0 14px var(--a);}
.hl-hud-corner{position:absolute;width:14px;height:14px;border:1px solid var(--a);opacity:.5;}
.hl-hud-corner.tl{top:8px;right:8px;border-left:0;border-bottom:0;}
.hl-hud-corner.br{bottom:8px;left:8px;border-right:0;border-top:0;}
.hl-hud-label{font-family:Orbitron;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);}
.hl-hud-value{display:block;font-family:Orbitron;font-weight:700;font-size:22px;margin:8px 0 2px;color:#fff;}
.hl-hud-sub{font-size:11px;color:var(--mut);}
.hl-hud-extra{display:block;margin-top:6px;font-size:11px;font-weight:600;}
.hl-hud-extra.good{color:#7fe6a0;}.hl-hud-extra.bad{color:#ff9aa4;}

.hl-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:stretch;}
.hl-col{display:flex;flex-direction:column;gap:16px;}
.hl-col.wide{min-width:0;}
.hl-row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

.hl-panel{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--hull);border:1px solid var(--line);border-radius:16px;padding:18px;}
.hl-panel.editing{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,216,77,.4),0 0 30px -12px var(--gold);}
.hl-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;}
.hl-panel-head h2{font-family:Orbitron;font-size:14px;letter-spacing:.06em;margin:0;color:#fff;}
.hl-panel-head p{font-size:11px;color:var(--mut);margin:3px 0 0;}
.hl-note{font-size:13px;color:var(--mut);line-height:1.6;margin:0;}

.hl-switch{display:flex;background:var(--void);border:1px solid var(--line);border-radius:999px;padding:3px;}
.hl-switch button{border:0;background:transparent;color:var(--mut);font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer;font-family:Inter;font-weight:600;}
.hl-switch button.on{background:var(--steel);color:#fff;}

.hl-form{display:flex;flex-direction:column;gap:11px;}
.hl-field{display:flex;flex-direction:column;gap:5px;}
.hl-field>span{font-size:11px;color:var(--mut);font-weight:600;}
.hl-field input{background:var(--void);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:15px;outline:none;transition:.15s;width:100%;}
.hl-field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,216,77,.12);}
.hl-field select{background:var(--void);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:15px;outline:none;width:100%;cursor:pointer;}
.hl-field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,216,77,.12);}
.hl-datefield{font-variant-numeric:tabular-nums;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

/* recorrencia */
.hl-rec{display:flex;flex-direction:column;gap:11px;border:1px dashed var(--line);border-radius:11px;padding:12px;background:rgba(255,255,255,.015);}
.hl-rec-title{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);font-weight:600;}
.hl-rec-title b{color:#cfe0ff;font-weight:600;}
.hl-rec .hl-switch{width:100%;}
.hl-rec .hl-switch button{flex:1;}
.hl-rec-freq{font-size:12px;color:var(--mut);background:var(--void);border:1px solid var(--line);border-radius:9px;padding:9px 12px;}
.hl-rec-freq b{color:var(--ink);font-weight:600;}
.hl-rec-dates{display:flex;gap:8px;}
.hl-rec-dates select{flex:1;background:var(--void);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:15px;outline:none;cursor:pointer;}
.hl-rec-dates select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,216,77,.12);}
.hl-rec-preview{font-size:12px;color:#9be8b4;line-height:1.5;padding:2px 2px 0;}
.hl-rec-preview.warn{color:#ffb648;}
.hl-rec-hint{font-size:12px;color:var(--mut);line-height:1.5;background:rgba(94,200,255,.06);border:1px solid rgba(94,200,255,.2);border-radius:9px;padding:9px 11px;}
.hl-rec-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:99px;background:rgba(94,200,255,.15);color:#5ec8ff;border:1px solid rgba(94,200,255,.3);vertical-align:middle;margin-left:6px;}

.hl-submit{margin-top:4px;border:0;border-radius:10px;padding:11px;font-family:Orbitron;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  background:linear-gradient(180deg,#ff5563,#d61f2d);color:#fff;box-shadow:0 8px 20px -10px #ff3b4a;transition:.15s;}
.hl-submit.income{background:linear-gradient(180deg,#56e784,#16a34a);box-shadow:0 8px 20px -10px #43e06a;}
.hl-submit.editing{background:linear-gradient(180deg,#ffd84d,#e0a800);color:#1a1300;box-shadow:0 8px 20px -10px #ffd84d;}
.hl-submit:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.hl-cancel{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:10px;font-size:12px;cursor:pointer;}
.hl-cancel:hover{color:var(--ink);}
.hl-tools{display:flex;gap:8px;margin-top:12px;}
.hl-ghost{flex:1;background:transparent;border:1px dashed var(--line);color:var(--mut);border-radius:9px;padding:8px;font-size:11px;cursor:pointer;}
.hl-ghost:hover{color:var(--ink);border-color:var(--mut);}
.hl-ghost.danger:hover{color:#ff9aa4;border-color:rgba(255,59,74,.4);}

/* em caixa */
.hl-caixa-val{font-family:Orbitron;font-weight:700;font-size:26px;color:#fff;}
.hl-caixa-sub{font-size:12px;color:var(--mut);margin-top:4px;}
.hl-caixa-edit{display:flex;gap:8px;margin-top:12px;}
.hl-caixa-edit input{flex:1;background:var(--void);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:14px;outline:none;}
.hl-caixa-edit input:focus{border-color:var(--gold);}
.hl-caixa-edit button{border:0;border-radius:9px;padding:0 16px;font-family:Orbitron;font-size:11px;letter-spacing:.08em;cursor:pointer;background:linear-gradient(180deg,#ffd84d,#e0a800);color:#1a1300;}

.hl-sabers{display:flex;flex-direction:column;gap:14px;max-height:212px;overflow-y:auto;overflow-x:hidden;margin-right:-6px;padding-right:6px;}
.hl-sabers::-webkit-scrollbar,.hl-tx-scroll::-webkit-scrollbar{width:8px;}
.hl-sabers::-webkit-scrollbar-thumb,.hl-tx-scroll::-webkit-scrollbar-thumb{background:rgba(120,150,210,.3);border-radius:99px;}
.hl-sabers::-webkit-scrollbar-track,.hl-tx-scroll::-webkit-scrollbar-track{background:transparent;}
.hl-sabers{scrollbar-width:thin;scrollbar-color:rgba(120,150,210,.3) transparent;}
.saber-row{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:12px;}
.saber-label{font-size:13px;color:var(--ink);font-weight:500;}
.saber-track{position:relative;display:flex;align-items:center;height:18px;}
.saber-hilt{position:relative;width:18px;height:16px;border-radius:3px;background:linear-gradient(180deg,#e6ebf4,#9aa3b6 52%,#4a5165);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);flex:0 0 auto;z-index:3;}
.saber-hilt::before{content:"";position:absolute;left:3px;top:3px;bottom:3px;width:2px;border-radius:2px;background:rgba(255,255,255,.55);}
.saber-hilt::after{content:"";position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:6px;height:11px;border-radius:1px;background:linear-gradient(180deg,#dfe5f0,#aab3c6);z-index:4;}
.saber-blade{height:9px;align-self:center;margin-left:-2px;border-radius:0 6px 6px 0;background:linear-gradient(90deg,#fff,var(--c) 26%);
  box-shadow:0 0 9px var(--c),0 0 20px var(--c);transform-origin:left;animation:ignite .5s cubic-bezier(.2,.8,.2,1) both;z-index:1;}
@keyframes ignite{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.saber-val{font-family:Orbitron;font-size:12px;color:#fff;min-width:84px;text-align:right;}

.hl-donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.hl-donut svg{width:140px;height:140px;flex:0 0 auto;}
.hl-donut-top{fill:#fff;font-family:Orbitron;font-size:20px;font-weight:700;}
.hl-donut-lbl{fill:var(--mut);font-size:8px;font-family:Inter;text-transform:uppercase;letter-spacing:.1em;}
.hl-legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;flex:1;min-width:140px;}
.hl-legend li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);}
.hl-legend li .dot{flex:0 0 9px;width:9px;height:9px;border-radius:2px;box-shadow:0 0 6px currentColor;}
.hl-legend li .lbl{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.25;}
.hl-legend li b{flex:0 0 auto;margin-left:8px;font-family:Orbitron;font-size:11px;color:var(--mut);font-weight:600;}

.hl-wlegend{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-bottom:12px;}
.hl-wlegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle;}
.hl-wlegend i.inc{background:#43e06a;}.hl-wlegend i.exp{background:#ff5563;}
.hl-weeks{display:flex;align-items:flex-end;gap:8px;height:150px;}
.hl-week{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.hl-week-bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;}
.hl-wbar{width:42%;max-width:18px;border-radius:4px 4px 0 0;min-height:2px;transition:height .5s;}
.hl-wbar.inc{background:linear-gradient(180deg,#56e784,#1f9e4a);box-shadow:0 0 10px -3px #43e06a;}
.hl-wbar.exp{background:linear-gradient(180deg,#ff6b78,#d61f2d);box-shadow:0 0 10px -3px #ff5563;}
.hl-week-lbl{font-size:10px;color:var(--mut);}

.hl-banks{display:flex;flex-direction:column;gap:11px;}
.hl-bank{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:10px;}
.hl-bank-name{font-size:13px;color:var(--ink);}
.hl-bank-bar{height:8px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;}
.hl-bank-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd84d,#ff9a3c);box-shadow:0 0 10px -2px #ffd84d;border-radius:99px;}
.hl-bank-val{font-family:Orbitron;font-size:11px;color:#fff;}

/* Quadro de patrimonio (fluxo x estoque) */
.hl-quadro{display:flex;flex-direction:column;gap:10px;}
.hl-qrow{display:grid;grid-template-columns:1.1fr 1fr 1fr;align-items:center;gap:12px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.hl-qrow.total{background:rgba(67,224,106,.07);border-color:rgba(67,224,106,.3);}
.hl-qrow.on{box-shadow:0 0 0 1px rgba(255,255,255,.18);}
.hl-qname{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);}
.hl-qname i{width:10px;height:10px;border-radius:99px;display:inline-block;}
.hl-qcell{display:flex;flex-direction:column;gap:2px;}
.hl-qcell small{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);}
.hl-qcell b{font-family:Orbitron;font-size:15px;color:#fff;}
.hl-qcell b.pos{color:#43e06a;} .hl-qcell b.neg{color:#ff3b4a;}

/* Evolucao do patrimonio (mes a mes) */
.hl-evo{display:flex;flex-direction:column;gap:8px;}
.hl-evohead,.hl-evorow{display:grid;grid-template-columns:90px 120px 1fr;align-items:center;gap:12px;}
.hl-evohead{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 4px 4px;}
.hl-evorow{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px;padding:9px 12px;}
.hl-evorow.on{box-shadow:0 0 0 1px rgba(46,166,255,.4);background:rgba(46,166,255,.06);}
.hl-evo-m{font-weight:600;color:var(--ink);font-size:13px;}
.hl-evo-res{font-family:Orbitron;font-size:12px;}
.hl-evo-res.pos{color:#43e06a;} .hl-evo-res.neg{color:#ff3b4a;}
.hl-evo-track{position:relative;height:22px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;display:flex;align-items:center;}
.hl-evo-track i{position:absolute;left:0;top:0;height:100%;border-radius:99px;opacity:.35;}
.hl-evo-track b{position:relative;font-family:Orbitron;font-size:11px;color:#fff;padding-left:10px;}

.hl-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;}
.hl-fact{background:var(--hull);border:1px solid var(--line);border-radius:12px;padding:14px;}
.hl-fact-label{font-size:11px;color:var(--mut);}

<body>
<div class="hl-stars" aria-hidden="true"></div>
<div class="hl-wrap" id="app"></div>
<script>
/* =========================================================
   DASHBOARD FINANCEIRA — lê a planilha do Google (Ricardo + Lais)
   A planilha é a fonte da verdade. Aqui só se lê e se mostra.
   ========================================================= */

/* ---------- fonte de dados ---------- */
var PUB_ID = "2PACX-1vSoTlIiUlwWLvrqZiTMkQV2XWZrQQIjK6ewiHbFmlugJJ-_F8HhCSxgfB96qjHrpdj_53nKFChwLvbQ";
var PUB_BASE = "https://docs.google.com/spreadsheets/d/e/" + PUB_ID;
function csvUrl(gid){ return PUB_BASE + "/pub?gid=" + gid + "&single=true&output=csv&_=" + Date.now(); }
function htmlUrl(){ return PUB_BASE + "/pubhtml?_=" + Date.now(); }
var SHEET_LINK = PUB_BASE + "/pubhtml";
/* se a descoberta automática de abas falhar, cai nestas */
var FALLBACK_SHEETS = [
  { gid:"1509277905", name:"26. OUTUBRO" },
  { gid:"72732217",   name:"26. NOVEMBRO" },
  { gid:"1695089265", name:"26. DEZEMBRO" },
  { gid:"362283345",  name:"EXTRA" }
];

/* ---------- login ---------- */
var USERS = { ricardo:"040925", lais:"040925" };

/* ---------- helpers ---------- */
var BRL = new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL" });
function money(n){ return BRL.format(Number(n)||0); }
function pct(n){ return (Number(n)||0).toFixed(0) + "%"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function norm(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim(); }
function titleCase(s){ s=String(s||"").trim(); return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var MESES_AB = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var MESES_N = MESES.map(norm);
function ymLabel(ym){ var a=ym.split("-").map(Number); return MESES_AB[a[1]-1]+"/"+a[0]; }
function ymNow(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function weekOfDay(day){ return Math.min(5, Math.ceil(day/7)); }

/* "R$ 1.173,89" / "4579,7" / "10.000" -> número */
function parseMoney(raw){
  var s = String(raw==null?"":raw).replace(/ /g," ").replace(/r\$/i,"").replace(/\s/g,"").trim();
  if(!s) return null;
  var neg = /^\(.*\)$/.test(s) || s.indexOf("-")===0;
  s = s.replace(/[()\-]/g,"");
  if(!/[\d]/.test(s)) return null;
  if(s.indexOf(",")>=0){ s = s.replace(/\./g,"").replace(",","."); }
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)){ s = s.replace(/\./g,""); }
  var n = parseFloat(s);
  if(isNaN(n)) return null;
  return neg ? -n : n;
}
/* "5" / "05/11" / "05/11/2026" / "2026-11-05" -> dia do mês */
function parseDay(raw){
  var s = String(raw==null?"":raw).trim();
  if(!s) return null;
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return Number(m[3]);
  m = s.match(/^(\d{1,2})\s*[\/\-.]/);        if(m) return clampDay(Number(m[1]));
  m = s.match(/^(\d{1,2})$/);                 if(m) return clampDay(Number(m[1]));
  m = s.match(/(\d{1,2})/);                   if(m) return clampDay(Number(m[1]));
  return null;
}
function clampDay(d){ return (d>=1 && d<=31) ? d : null; }
/* "Sim"/"x"/"ok" -> true | "Não" -> false | vazio -> null */
function parseFlag(raw){
  var s = norm(raw);
  if(!s) return null;
  if(["sim","s","x","ok","pago","paga","recebido","recebida","true","1","v"].indexOf(s)>=0) return true;
  if(["nao","n","no","false","0","pendente","em aberto","aberto"].indexOf(s)>=0) return false;
  return null;
}

/* nome da aba -> "AAAA-MM" (ou null se não for um mês) */
function sheetToYM(name){
  var n = norm(name);
  if(!n) return null;
  if(/template|modelo|exemplo|extra|patrim|saldo|config|instru/.test(n)) return null;
  var mi = -1;
  for(var i=0;i<MESES_N.length;i++){ if(n.indexOf(MESES_N[i])>=0){ mi=i; break; } }
  if(mi>=0){
    var yr = n.replace(MESES_N[mi],"").match(/(\d{2,4})/);
    var y = yr ? Number(yr[1]) : new Date().getFullYear();
    if(y<100) y += 2000;
    return y + "-" + String(mi+1).padStart(2,"0");
  }
  var d = n.match(/(\d{1,2})\s*[\/\-.]\s*(\d{4})/);
  if(d) return Number(d[2]) + "-" + String(Number(d[1])).padStart(2,"0");
  d = n.match(/(\d{4})\s*[\/\-.]\s*(\d{1,2})/);
  if(d) return Number(d[1]) + "-" + String(Number(d[2])).padStart(2,"0");
  return null;
}
function isExtraSheet(name){ return /extra|patrim|saldo|ponto de partida/.test(norm(name)); }

/* ---------- CSV ---------- */
function looksLikeHTML(t){ return /^\s*<(!doctype|html)/i.test(String(t||"")); }
function parseCSV(text){
  var rows=[], row=[], cur="", q=false, i=0;
  text = String(text||"").replace(/^﻿/,"");
  if(looksLikeHTML(text)) return [];
  while(i<text.length){
    var ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;
    } else {
      if(ch==='"') q=true;
      else if(ch===","){ row.push(cur); cur=""; }
      else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(ch==="\r"){ /* ignora */ }
      else cur+=ch;
    }
    i++;
  }
  row.push(cur); rows.push(row);
  return rows;
}

/* ---------- leitura de uma aba de mês ---------- */
/* Layout esperado (o parser se vira com variações):
   [Saídas] Pessoa | Dia | Valor | Descrição | Pago   ...   [Entradas] Pessoa | Dia | Valor | Descrição | Recebido
   Colunas extras reconhecidas se existirem: Banco, Forma de pagamento. */
function findHeader(rows){
  for(var r=0;r<Math.min(rows.length,12);r++){
    var line = rows[r].map(norm);
    var hasVal = line.some(function(c){ return c==="valor"; });
    var hasDesc = line.some(function(c){ return c.indexOf("descri")===0; });
    if(hasVal && hasDesc) return r;
  }
  return -1;
}
function blockSplit(rows, hdr){
  /* coluna onde começa o bloco de entradas */
  for(var r=Math.max(0,hdr-2); r<=hdr; r++){
    var line = rows[r]||[];
    for(var c=0;c<line.length;c++){
      if(norm(line[c]).indexOf("entrada")===0) return c;
    }
  }
  /* sem rótulo "Entradas": usa a 2ª ocorrência de "Valor" */
  var line2 = (rows[hdr]||[]).map(norm), seen=0;
  for(var k=0;k<line2.length;k++){ if(line2[k]==="valor"){ seen++; if(seen===2) return Math.max(0,k-2); } }
  return line2.length;
}
function colsIn(headerRow, from, to){
  var idx = { dia:-1, valor:-1, desc:-1, pessoa:-1, flag:-1, banco:-1, forma:-1 };
  for(var c=from;c<to && c<headerRow.length;c++){
    var h = norm(headerRow[c]);
    if(!h) continue;
    if(idx.dia<0 && h==="dia") idx.dia=c;
    else if(idx.valor<0 && h==="valor") idx.valor=c;
    else if(idx.desc<0 && h.indexOf("descri")===0) idx.desc=c;
    else if(idx.pessoa<0 && (h==="pessoa"||h==="quem"||h==="responsavel")) idx.pessoa=c;
    else if(idx.flag<0 && (h.indexOf("pago")===0||h.indexOf("recebid")===0||h.indexOf("status")===0)) idx.flag=c;
    else if(idx.banco<0 && (h==="banco"||h==="conta")) idx.banco=c;
    else if(idx.forma<0 && (h.indexOf("forma")===0||h==="pagamento"||h==="metodo")) idx.forma=c;
  }
  return idx;
}
function readMonthSheet(rows, ym, sheetName){
  var out = { expenses:[], income:[], hasBank:false, hasForma:false };
  var hdr = findHeader(rows);
  if(hdr<0) return out;
  var split = blockSplit(rows, hdr);
  var head = rows[hdr];
  var cExp = colsIn(head, 0, split);
  var cInc = colsIn(head, split, head.length);
  var seq = 0;
  function pull(cols, kind){
    if(cols.valor<0) return;
    for(var r=hdr+1;r<rows.length;r++){
      var line = rows[r]||[];
      var val = parseMoney(line[cols.valor]);
      if(val===null || val===0) continue;
      var desc = cols.desc>=0 ? String(line[cols.desc]||"").trim() : "";
      if(norm(desc)==="exemplo") continue;
      var pessoa = cols.pessoa>=0 ? String(line[cols.pessoa]||"").trim() : "";
      var banco = cols.banco>=0 ? String(line[cols.banco]||"").trim() : "";
      var forma = cols.forma>=0 ? String(line[cols.forma]||"").trim() : "";
      if(banco) out.hasBank=true;
      if(forma) out.hasForma=true;
      out[kind].push({
        id: ym+"-"+kind+"-"+(seq++),
        ym: ym,
        sheet: sheetName,
        row: r+1,
        amount: Math.abs(val),
        label: desc || (kind==="income" ? "Entrada" : "Gasto"),
        cat: norm(desc) || (kind==="income" ? "entrada" : "sem descricao"),
        pessoa: pessoa,
        day: cols.dia>=0 ? parseDay(line[cols.dia]) : null,
        flag: cols.flag>=0 ? parseFlag(line[cols.flag]) : null,
        banco: banco,
        forma: forma
      });
    }
  }
  pull(cExp, "expenses");
  pull(cInc, "income");
  return out;
}

/* ---------- leitura da aba EXTRA (ponto de partida) ---------- */
/* Linha 1 tem os donos ("Ricardo", "Lais", ...); abaixo, rótulo + valor na coluna seguinte. */
function readExtraSheet(rows){
  var blocks = [];
  if(!rows || !rows.length) return blocks;
  var head = rows[0] || [];
  for(var c=0;c<head.length;c++){
    var name = String(head[c]||"").trim();
    if(!name) continue;
    if(parseMoney(name)!==null) continue;
    var items=[], total=0;
    for(var r=1;r<rows.length;r++){
      var line = rows[r]||[];
      var v = parseMoney(line[c+1]);
      var lbl = String(line[c]||"").trim();
      if(v===null || v===0) continue;
      items.push({ label: lbl || "sem rótulo", value: v });
      total += v;
    }
    blocks.push({ name:name, key:norm(name), items:items, total:total });
    c++; /* a coluna de valores já foi consumida */
  }
  return blocks;
}

/* ---------- cores ---------- */
var SABER = {
  "aluguel":"#ff3b4a","condominio":"#c084fc","contas de casa":"#a855f7","luz":"#ffd84d","agua":"#5ec8ff",
  "internet":"#7c5cff","celular":"#22d3ee","mercado":"#43e06a","transporte":"#2ea6ff","uber":"#2ea6ff",
  "saude":"#f5f7ff","hobbies":"#22d3ee","lazer":"#22d3ee","restaurante":"#ffb648","comer fora":"#ffb648",
  "educacao":"#ffd84d","estudo":"#7c5cff","trabalho":"#00d1b2","investimentos":"#5ec8ff","presentes":"#ff84d8",
  "roupas e acessorios":"#ff5ed1","roupas e afins":"#ff5ed1","iptu":"#ff9a3c","mei":"#ff9a3c",
  "nubank":"#a855f7","itau":"#ff9a3c","claude":"#ff9a3c","outros":"#7d8aa8"
};
var SABER_FALLBACK = ["#2ea6ff","#43e06a","#ff3b4a","#a855f7","#ff9a3c","#22d3ee","#ffd84d","#ff5ed1","#00d1b2","#7c5cff"];
function colorFor(cat,i){
  if(SABER[cat]) return SABER[cat];
  var h=0, s=String(cat||"");
  for(var k=0;k<s.length;k++) h=(h*31+s.charCodeAt(k))>>>0;
  return SABER_FALLBACK[(h + (i||0)) % SABER_FALLBACK.length];
}

/* ---------- perfis ---------- */
var PROFILE_COLORS = { ricardo:"#2ea6ff", lais:"#ffd84d", casa:"#ff9a3c" };
var PROFILE_DISPLAY = { ricardo:"Ricardo", lais:"Lais (linda da minha vida)", casa:"Casa" };
var CASA_KEY = "casa";
function pessoaKey(p){ var n=norm(p); return n ? n : CASA_KEY; }
function pessoaColor(key,i){ return PROFILE_COLORS[key] || colorFor(key,i); }

/* ---------- estado ---------- */
var state = {
  authed:false, user:null, loginError:"",
  profile:"galaxia",
  month:null,
  loading:true, error:null, loadedAt:null,
  months:[],          /* [{ym, name, gid}] ordenado */
  tx:{},              /* ym -> {expenses, income} */
  extra:[],           /* blocos da aba EXTRA */
  people:[],          /* chaves de pessoa vistas nos lançamentos */
  hasBank:false, hasForma:false
};

/* ---------- carregamento ---------- */
function fetchText(url){
  return fetch(url, { cache:"no-store" }).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  });
}
function discoverSheets(){
  return fetchText(htmlUrl()).then(function(html){
    var out=[], re=/name:\s*"([^"]*)"[\s\S]{0,600}?gid:\s*"(\d+)"/g, m;
    while((m=re.exec(html))){ out.push({ name:m[1], gid:m[2] }); }
    if(!out.length) throw new Error("sem abas");
    return out;
  }).catch(function(){ return FALLBACK_SHEETS.slice(); });
}
function loadAll(){
  state.loading = true; state.error = null;
  if(!state.months.length) render();
  return discoverSheets().then(function(sheets){
    var months=[], extras=[];
    sheets.forEach(function(s){
      if(isExtraSheet(s.name)){ extras.push(s); return; }
      var ym = sheetToYM(s.name);
      if(ym) months.push({ ym:ym, name:s.name, gid:s.gid });
    });
    months.sort(function(a,b){ return a.ym<b.ym?-1:1; });
    var jobs = months.map(function(mm){
      return fetchText(csvUrl(mm.gid)).then(function(t){
        return { ym:mm.ym, name:mm.name, data:readMonthSheet(parseCSV(t), mm.ym, mm.name) };
      }).catch(function(){
        return { ym:mm.ym, name:mm.name, data:{ expenses:[], income:[], hasBank:false, hasForma:false } };
      });
    });
    var extraJobs = extras.map(function(s){
      return fetchText(csvUrl(s.gid)).then(function(t){ return readExtraSheet(parseCSV(t)); }).catch(function(){ return []; });
    });
    return Promise.all([Promise.all(jobs), Promise.all(extraJobs)]).then(function(res){
      var tx={}, people={}, hasBank=false, hasForma=false;
      res[0].forEach(function(r){
        tx[r.ym] = { expenses:r.data.expenses, income:r.data.income };
        hasBank = hasBank || r.data.hasBank;
        hasForma = hasForma || r.data.hasForma;
        r.data.expenses.concat(r.data.income).forEach(function(t){ people[pessoaKey(t.pessoa)] = true; });
      });
      state.months = months;
      state.tx = tx;
      state.extra = [].concat.apply([], res[1]);
      state.hasBank = hasBank; state.hasForma = hasForma;
      state.extra.forEach(function(b){ if(b.items.length) people[b.key]=true; });
      var order = ["ricardo","lais",CASA_KEY];
      state.people = Object.keys(people).sort(function(a,b){
        var ia=order.indexOf(a), ib=order.indexOf(b);
        return (ia<0?99:ia)-(ib<0?99:ib) || (a<b?-1:1);
      });
      if(!state.month || !tx[state.month]) state.month = pickMonth(months);
      state.loading=false; state.loadedAt=new Date();
      render();
    });
  }).catch(function(e){
    state.loading=false; state.error = e && e.message ? e.message : String(e); render();
  });
}
function pickMonth(months){
  if(!months.length) return null;
  var now = ymNow();
  for(var i=0;i<months.length;i++){ if(months[i].ym===now) return now; }
  var past = months.filter(function(m){ return m.ym<=now; });
  if(past.length) return past[past.length-1].ym;
  return months[0].ym;
}

/* ---------- seleção / cálculo ---------- */
function monthSet(ym){
  var d = state.tx[ym] || { expenses:[], income:[] };
  return d;
}
function belongs(t){
  if(state.profile==="galaxia") return true;
  return pessoaKey(t.pessoa)===state.profile;
}
function sumMonth(ym, kind){
  var d = monthSet(ym), arr = d[kind]||[], s=0;
  for(var i=0;i<arr.length;i++){ if(belongs(arr[i])) s += arr[i].amount; }
  return s;
}
function sumMonthAll(ym, kind, personKey){
  var d = monthSet(ym), arr = d[kind]||[], s=0;
  for(var i=0;i<arr.length;i++){
    if(personKey==null || pessoaKey(arr[i].pessoa)===personKey) s += arr[i].amount;
  }
  return s;
}
function startingFor(personKey){
  var s=0;
  state.extra.forEach(function(b){ if(personKey==null || b.key===personKey) s += b.total; });
  return s;
}
/* ponto de partida só conta para quem tem bloco na aba EXTRA */
function startingProfile(){
  if(state.profile==="galaxia") return startingFor(null);
  return startingFor(state.profile);
}
function monthsUpTo(ym){ return state.months.filter(function(m){ return m.ym<=ym; }); }

function compute(){
  var m = state.month;
  var d = monthSet(m);
  var mExp = (d.expenses||[]).filter(belongs);
  var mInc = (d.income||[]).filter(belongs);
  var totalExp = mExp.reduce(function(s,e){return s+e.amount;},0);
  var totalInc = mInc.reduce(function(s,e){return s+e.amount;},0);
  var balance = totalInc-totalExp;

  var idx = state.months.map(function(x){return x.ym;}).indexOf(m);
  var pm = idx>0 ? state.months[idx-1].ym : null;
  var prevExp = pm ? sumMonth(pm,"expenses") : 0;
  var deltaExp = (pm && prevExp>0 && totalExp>0) ? (totalExp-prevExp)/prevExp*100 : null;

  var acum = startingProfile();
  monthsUpTo(m).forEach(function(x){ acum += sumMonth(x.ym,"income") - sumMonth(x.ym,"expenses"); });

  var rmap={};
  mExp.forEach(function(e){ if(!rmap[e.cat]) rmap[e.cat]={cat:e.cat,label:e.label,val:0}; rmap[e.cat].val+=e.amount; });
  var ranking = Object.keys(rmap).map(function(k){return rmap[k];}).sort(function(a,b){return b.val-a.val;});

  function group(arr, field, fallback){
    var mp={};
    arr.forEach(function(e){ var k=(e[field]||"").trim()||fallback; mp[k]=(mp[k]||0)+e.amount; });
    return Object.keys(mp).map(function(k){return {name:k,val:mp[k]};}).sort(function(a,b){return b.val-a.val;});
  }
  var banks = state.hasBank ? group(mExp,"banco","Sem banco") : [];
  var formas = state.hasForma ? group(mExp,"forma","Não informado") : [];

  var weeks=[0,0,0,0,0], weeksInc=[0,0,0,0,0], semData=0;
  mExp.forEach(function(e){ if(e.day) weeks[weekOfDay(e.day)-1]+=e.amount; else semData++; });
  mInc.forEach(function(e){ if(e.day) weeksInc[weekOfDay(e.day)-1]+=e.amount; else semData++; });
  var temData = weeks.concat(weeksInc).some(function(v){return v>0;});

  var abertoExp = mExp.filter(function(e){return e.flag===false;}).reduce(function(s,e){return s+e.amount;},0);
  var pagoExp   = mExp.filter(function(e){return e.flag===true;}).reduce(function(s,e){return s+e.amount;},0);
  var abertoInc = mInc.filter(function(e){return e.flag===false;}).reduce(function(s,e){return s+e.amount;},0);
  var recebInc  = mInc.filter(function(e){return e.flag===true;}).reduce(function(s,e){return s+e.amount;},0);
  var semFlag = mExp.concat(mInc).filter(function(e){return e.flag===null;}).length;

  var tx = mExp.map(function(x){var o=Object.assign({},x);o.kind="expense";return o;})
    .concat(mInc.map(function(x){var o=Object.assign({},x);o.kind="income";return o;}))
    .sort(function(a,b){
      var da=a.day||0, db=b.day||0;
      if(da!==db) return db-da;
      return b.amount-a.amount;
    });

  var semPessoa = (d.expenses||[]).concat(d.income||[]).filter(function(t){return !norm(t.pessoa);}).length;

  return { mExp:mExp, mInc:mInc, totalExp:totalExp, totalInc:totalInc, balance:balance,
    deltaExp:deltaExp, prevYM:pm, ranking:ranking, banks:banks, formas:formas,
    weeks:weeks, weeksInc:weeksInc, temData:temData, semData:semData,
    abertoExp:abertoExp, pagoExp:pagoExp, abertoInc:abertoInc, recebInc:recebInc, semFlag:semFlag,
    tx:tx, saldoInicial:startingProfile(), saldoAcumulado:acum, semPessoa:semPessoa };
}

/* quadro por responsável no mês selecionado */
function quadroPatrimonio(m){
  var linhas = state.people.map(function(k){
    var res = sumMonthAll(m,"income",k) - sumMonthAll(m,"expenses",k);
    var acum = startingFor(k);
    monthsUpTo(m).forEach(function(x){ acum += sumMonthAll(x.ym,"income",k) - sumMonthAll(x.ym,"expenses",k); });
    return { id:k, nome:(k===CASA_KEY?"Casa":titleCase(k)), res:res, acum:acum };
  });
  var res=0, acum=0;
  linhas.forEach(function(l){ res+=l.res; acum+=l.acum; });
  linhas.push({ id:"galaxia", nome:"Galáxia", res:res, acum:acum });
  return linhas;
}
/* evolução mês a mês do conjunto selecionado */
function evolucao(){
  var acum = startingProfile();
  return state.months.map(function(x){
    var inc = sumMonth(x.ym,"income"), exp = sumMonth(x.ym,"expenses");
    var res = inc-exp; acum += res;
    return { ym:x.ym, inc:inc, exp:exp, res:res, acum:acum };
  });
}

/* ---------- peças de UI ---------- */
function hud(label,sub,value,accent,extra,extraGood){
  return '<div class="hl-hud" style="--a:'+accent+'"><div class="hl-hud-corner tl"></div><div class="hl-hud-corner br"></div>'
    +'<span class="hl-hud-label">'+label+'</span><span class="hl-hud-value">'+value+'</span><span class="hl-hud-sub">'+sub+'</span>'
    +(extra?'<span class="hl-hud-extra '+(extraGood?"good":"bad")+'">'+extra+'</span>':'')+'</div>';
}
function emptyBox(text){ return '<div class="hl-empty"><span class="hl-empty-icon">✶</span><span>'+text+'</span></div>'; }
function donutSVG(ranking,total){
  var r=54,cx=70,cy=70,circ=2*Math.PI*r,acc=0;
  var segs=ranking.map(function(d,i){var f=d.val/total;var s={label:d.label,val:d.val,color:colorFor(d.cat,i),dash:f*circ,offset:-acc*circ};acc+=f;return s;});
  var top=ranking[0];
  var circles=segs.map(function(s){
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="14" stroke-dasharray="'+s.dash+' '+(circ-s.dash)+'" stroke-dashoffset="'+s.offset+'" transform="rotate(-90 '+cx+' '+cy+')" style="filter:drop-shadow(0 0 4px '+s.color+')"></circle>';
  }).join("");
  var legend=segs.slice(0,7).map(function(s){return '<li><span class="dot" style="background:'+s.color+'"></span><span class="lbl">'+esc(s.label)+'</span><b>'+pct(s.val/total*100)+'</b></li>';}).join("");
  return '<div class="hl-donut"><svg viewBox="0 0 140 140"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="14"></circle>'
    +circles+'<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" class="hl-donut-top">'+pct(top.val/total*100)+'</text>'
    +'<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" class="hl-donut-lbl">'+esc(top.label)+'</text></svg><ul class="hl-legend">'+legend+'</ul></div>';
}
function barList(items, colorA, colorB){
  var max = items[0].val || 1;
  return '<div class="hl-banks">'+items.map(function(b){
    return '<div class="hl-bank"><span class="hl-bank-name">'+esc(b.name)+'</span>'
      +'<span class="hl-bank-bar"><i style="width:'+(b.val/max*100)+'%;background:linear-gradient(90deg,'+colorA+','+colorB+')"></i></span>'
      +'<span class="hl-bank-val">'+money(b.val)+'</span></div>';
  }).join("")+'</div>';
}

/* ---------- login ---------- */
function renderLogin(){
  document.getElementById("app").innerHTML=
    '<div class="hl-login"><div class="hl-login-card">'
      +'<h1 class="hl-login-title">Acesso</h1>'
      +'<p class="hl-login-sub">Identifique-se, piloto.</p>'
      +'<label class="hl-field"><span>Usuário</span><input id="login-user" autocomplete="username" placeholder="ricardo ou lais"></label>'
      +'<label class="hl-field"><span>Senha</span><input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••"></label>'
      +(state.loginError?'<div class="hl-login-err">'+state.loginError+'</div>':'')
      +'<button class="hl-submit" data-act="login">Entrar</button>'
    +'</div></div>';
  var u=document.getElementById("login-user"); if(u) u.focus();
}
function doLogin(){
  var u=(document.getElementById("login-user").value||"").trim().toLowerCase();
  var p=(document.getElementById("login-pass").value||"").trim();
  if(USERS[u]!==undefined && USERS[u]===p){
    state.user=u; state.authed=true; state.loginError="";
    try{ localStorage.setItem("holocron:session", u); }catch(e){}
    if(state.loading && !state.months.length) loadAll(); else render();
  } else {
    state.loginError="Usuário ou senha incorretos.";
    renderLogin();
  }
}
function doLogout(){
  state.authed=false; state.user=null; state.loginError="";
  try{ localStorage.removeItem("holocron:session"); }catch(e){}
  renderLogin();
}
function route(){ if(state.authed) render(); else renderLogin(); }

  var app = document.getElementById("app");

    ? emptyBox(isGalaxia
        ? "Sem aba de saldos. Crie uma aba chamada <b>EXTRA</b> com o nome de cada um na 1ª linha e, abaixo, a conta e o valor ao lado."

    : '<div class="hl-extra">'+extraBlocks.map(function(b,i){

          +b.items.map(function(it){ return '<div class="hl-extra-item"><span>'+esc(it.label)+'</span><b>'+money(it.value)+'</b></div>'; }).join("")
          +'</div>';
      }).join("")+'</div>';
  extraHtml += '<div class="hl-caixa-sub" style="margin-top:10px">patrimônio em '+ymLabel(state.month)+': <b style="color:#cfe0ff">'+money(c.saldoAcumulado)+'</b></div>';

      +'<span class="hl-qcell"><small>saldo acumulado</small><b>'+money(q.acum)+'</b></span>'

  if(evo.length===0){ evoHtml = emptyBox("Sem meses na planilha ainda."); }
  else {
    var maxA = Math.max.apply(null, evo.map(function(x){return Math.abs(x.acum);}).concat([1]));

  if(state.hasForma && c.formas.length) sidePanels += '<section class="hl-panel"><div class="hl-panel-head"><div><h2>Por forma de pagamento</h2><p>coluna Forma de pagamento</p></div></div>'+barList(c.formas,"#5ec8ff","#2ea6ff")+'</section>';

  app.innerHTML =

/* alinha o fundo do Registro de bordo com o fim da coluna esquerda */
function alignLog(){
  var grid=document.querySelector(".hl-grid");
  if(!grid || grid.children.length<2) return;
  var left=grid.children[0], right=grid.children[1];
  var fill=right.querySelector(".hl-panel-fill");
  if(!fill) return;
  if(window.innerWidth<=880){ fill.style.maxHeight=""; return; }
  fill.style.maxHeight="";
  var leftH=left.getBoundingClientRect().height;
  var others=0;
  Array.prototype.forEach.call(right.children,function(ch){ if(ch!==fill) others+=ch.getBoundingClientRect().height; });
  var gap=parseFloat(getComputedStyle(right).rowGap||"16")||16;
  var target=leftH-others-gap*(right.children.length-1);
  if(target>320) fill.style.maxHeight=target+"px";
}
var _alignRAF;
window.addEventListener("resize",function(){ cancelAnimationFrame(_alignRAF); _alignRAF=requestAnimationFrame(alignLog); });

/* ---------- eventos ---------- */
var app=document.getElementById("app");
app.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");
  if(!el) return;
  var act=el.getAttribute("data-act");
  if(act==="login"){ doLogin(); }
  else if(act==="logout"){ doLogout(); }
  else if(act==="tab"){ state.profile=el.getAttribute("data-id"); render(); }
  else if(act==="goto"){ state.month=el.getAttribute("data-id"); render(); }
  else if(act==="reload"){
    if(el.tagName==="BUTTON"){ el.disabled=true; el.textContent="↻ lendo…"; }
    loadAll();
  }
});
app.addEventListener("keydown",function(ev){
  if(ev.key==="Enter" && (ev.target.id==="login-user"||ev.target.id==="login-pass")) doLogin();
});
app.addEventListener("change",function(ev){
  if(ev.target.id==="ciclo-aba"){ state.month=ev.target.value; render(); }
});

/* ---------- boot ---------- */
(function(){
  try{
    var s=localStorage.getItem("holocron:session");
    if(s && USERS[s]!==undefined){ state.user=s; state.authed=true; }
  }catch(e){}
  if(state.authed) loadAll(); else renderLogin();
})();
</script>
